<!DOCTYPE html>
<!--
  [조작법 1] 마우스나 손가락으로 부품을 끌어서(드래그) 반짝이는 자리나 알맞은 칸에 놓으세요. 가까이 가면 자석처럼 딱! 붙어요.
  [조작법 2] 빈 곳을 끌면 화면이 살짝 회전해요. 위쪽 🔊 버튼은 음성 안내 다시 듣기, 🔇는 소리 끄기예요.
  [조작법 3] 검수 단계에서는 볼펜의 단추(밀대)를 눌러 "딸깍"을 확인하고, 괜찮으면 [네!] / 잘못된 곳이 있으면 [아니요]를 눌러요.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>볼펜 조립 공장 - 진로·직업교육 3D 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖊️</text></svg>">
<style>
/* ============ 기본 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  background:radial-gradient(1400px 800px at 50% -10%,#f4f9ff 0%,#dfeafa 45%,#cbd9ea 100%);color:#0f172a}
:root{--sb:290px} /* 왼쪽 체크리스트 칸 너비 — 3D 화면은 그 오른쪽만 사용(겹치지 않음) */
canvas{position:fixed;top:0;left:0;z-index:0;touch-action:none;display:block}
button{font-family:inherit;cursor:pointer}

/* ============ 화면(스크린) ============ */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;background:rgba(238,245,255,.93);backdrop-filter:blur(6px);padding:20px;text-align:center}
.hide{display:none !important}
.title{font-size:clamp(40px,7vw,72px);font-weight:900;color:#1d4ed8;text-shadow:0 3px 0 #fff}
.subtitle{font-size:clamp(20px,3.4vw,30px);font-weight:700;color:#334155}
.qtitle{font-size:clamp(30px,5vw,48px);font-weight:900;color:#0f172a}
.bigbtn{min-width:300px;min-height:92px;font-size:clamp(26px,4vw,36px);font-weight:900;color:#fff;
  background:linear-gradient(180deg,#3b82f6,#2563eb);border:4px solid #1e40af;border-radius:26px;
  box-shadow:0 8px 0 #1e3a8a,0 16px 30px rgba(30,64,175,.22);transition:transform .08s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #1e3a8a}
.bigbtn.green{background:linear-gradient(180deg,#22c55e,#16a34a);border-color:#15803d;box-shadow:0 8px 0 #14532d,0 16px 30px rgba(21,128,61,.2)}
.bigbtn.green:active{box-shadow:0 3px 0 #14532d}
.cards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.card{width:min(320px,42vw);min-width:250px;min-height:270px;background:#fff;border:4px solid #e2e8f0;border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 10px 0 #cbd5e1,0 20px 36px rgba(15,23,42,.10);transition:transform .08s}
.card:active{transform:translateY(6px);box-shadow:0 4px 0 #cbd5e1}
.card:hover{border-color:#2563eb}
.cicon{font-size:84px;line-height:1}
.cname{font-size:34px;font-weight:900}
.cdesc{font-size:20px;font-weight:700;color:#475569}
.cbadge{font-size:22px;font-weight:900;padding:8px 20px;border-radius:999px;color:#fff}
.cbadge.easy{background:#16a34a}
.cbadge.hard{background:#ea580c}
.backbtn{position:fixed;top:18px;left:18px;min-height:64px;min-width:130px;font-size:26px;font-weight:900;
  background:#fff;color:#334155;border:5px solid #94a3b8;border-radius:20px}
.hint3{display:flex;flex-direction:column;gap:10px;font-size:clamp(17px,2.4vw,22px);font-weight:700;color:#475569;
  background:#fff;border:4px solid #cbd5e1;border-radius:22px;padding:18px 26px;text-align:left}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud button{pointer-events:auto}
#sidebar{position:absolute;left:0;top:0;bottom:0;width:var(--sb);
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.4));
  border-right:2px solid rgba(37,99,235,.14);box-shadow:8px 0 24px -12px rgba(30,64,175,.18)}
#chips{position:fixed;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;width:262px}
.chip{font-size:16px;font-weight:900;padding:7px 10px;border-radius:999px;background:#fff;color:#64748b;
  border:3px solid #cbd5e1;box-shadow:0 4px 12px rgba(15,23,42,.08)}
.chip.on{background:#2563eb;color:#fff;border-color:#1e40af;transform:scale(1.07)}
.chip.done{background:#dcfce7;color:#15803d;border-color:#86efac}
#stats{position:fixed;top:14px;right:150px;display:flex;gap:10px;font-size:24px;font-weight:900}
#stats span{background:#fff;border:4px solid #cbd5e1;border-radius:999px;padding:12px 20px}
#topbtns{position:fixed;top:14px;right:14px;display:flex;gap:8px}
.round{width:62px;height:62px;border-radius:50%;font-size:28px;background:#fff;border:4px solid #94a3b8}
#banner{position:fixed;top:96px;left:calc(50% + var(--sb)/2);transform:translateX(-50%);max-width:min(800px,calc(100vw - var(--sb) - 40px));
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:4px solid #2563eb;border-radius:24px;padding:16px 24px;
  display:flex;align-items:center;gap:14px;box-shadow:0 8px 20px rgba(30,64,175,.25);pointer-events:auto}
#banner.pop{animation:bpop .35s}
@keyframes bpop{0%{transform:translateX(-50%) scale(.92)}60%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}
#bannerText{font-size:clamp(22px,3.4vw,32px);font-weight:900;line-height:1.3}
#btnSpeak{width:56px;height:56px;flex:none;border-radius:50%;font-size:24px;background:#eff6ff;border:4px solid #93c5fd}
#pressDots{display:flex;gap:8px;margin-left:6px}
#pressDots i{width:26px;height:26px;border-radius:50%;border:4px solid #94a3b8;opacity:.25;font-style:normal}
#pressDots i.on{opacity:1;border-color:#16a34a}

/* ============ 검수 버튼 ============ */
#checkBtns{position:fixed;bottom:34px;left:calc(50% + var(--sb)/2);transform:translateX(-50%);display:flex;gap:18px;
  align-items:center;pointer-events:auto;z-index:6}
#btnCheckYes{min-width:260px;min-height:96px;font-size:34px;font-weight:900;color:#fff;background:#16a34a;
  border:6px solid #15803d;border-radius:28px;box-shadow:0 8px 0 #14532d;animation:pulseY 1.2s infinite}
#btnCheckNo{min-width:220px;min-height:96px;font-size:34px;font-weight:900;color:#fff;background:#f97316;
  border:6px solid #c2410c;border-radius:28px;box-shadow:0 8px 0 #9a3412}
@keyframes pulseY{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#btnHelp{position:fixed;bottom:34px;right:20px;min-height:84px;min-width:220px;font-size:28px;font-weight:900;
  color:#7c2d12;background:#ffedd5;border:6px solid #fb923c;border-radius:24px;box-shadow:0 6px 0 #ea580c;z-index:6}
#btnHelp:active{transform:translateY(4px);box-shadow:0 2px 0 #ea580c}

/* ============ 과제 체크리스트(왼쪽, TEACCH 시각 스케줄) ============ */
#taskPanel{position:fixed;left:14px;top:70px;width:262px;max-height:calc(100vh - 86px);overflow:hidden;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:4px solid #2563eb;border-radius:22px;
  padding:12px 12px 13px;pointer-events:none;z-index:5;box-shadow:0 12px 30px rgba(30,64,175,.18)}
.tpHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px;
  font-size:19px;font-weight:900;color:#1d4ed8;white-space:nowrap}
#tpPen{font-size:16px;font-weight:900;color:#475569;background:#eef2ff;border-radius:999px;padding:3px 10px;white-space:nowrap}
#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#taskList li{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#64748b;
  background:#f8fafc;border:3px solid #e2e8f0;border-radius:13px;padding:5px 9px;transition:transform .15s,background .2s}
#taskList li .tk{width:30px;height:30px;flex:none;border-radius:9px;border:3px solid #cbd5e1;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#94a3b8}
#taskList li .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#taskList li .tc{font-size:14px;color:#94a3b8;font-weight:900}
#taskList li.now{border-color:#f59e0b;background:#fffbeb;color:#0f172a;transform:translateX(5px)}
#taskList li.now .tk{border-color:#f59e0b;background:#fef3c7;color:#b45309}
#taskList li.ok{border-color:#86efac;background:#f0fdf4;color:#15803d}
#taskList li.ok .tk{border-color:#22c55e;background:#22c55e;color:#fff;font-size:20px}
#taskList li.just .tk{animation:tickPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes tickPop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
#taskPanel.compact #taskList{gap:4px}
#taskPanel.compact #taskList li{font-size:16px;padding:3px 8px;border-radius:11px}
#taskPanel.compact #taskList li .tk{width:26px;height:26px;font-size:15px}

/* ============ 합격 도장 / 토스트 / 색종이 ============ */
#stamp{position:fixed;top:50%;left:calc(50% + var(--sb)/2);z-index:20;transform:translate(-50%,-50%) rotate(-12deg);
  font-size:clamp(70px,14vw,130px);font-weight:900;color:#dc2626;border:12px solid #dc2626;border-radius:30px;
  padding:6px 40px;background:rgba(255,255,255,.9);pointer-events:none;animation:stampIn .5s}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}
  70%{transform:translate(-50%,-50%) rotate(-12deg) scale(.95);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
#toast{position:fixed;top:42%;left:calc(50% + var(--sb)/2);transform:translate(-50%,-50%);z-index:18;font-size:44px;font-weight:900;
  color:#1d4ed8;background:#fff;border:6px solid #2563eb;border-radius:26px;padding:20px 44px;pointer-events:none;
  animation:bpop2 .4s}
@keyframes bpop2{0%{transform:translate(-50%,-50%) scale(.8);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cf{position:fixed;top:-6vh;z-index:19;font-size:30px;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(115vh) rotate(360deg)}}

/* ============ 결과 ============ */
#resCard{background:#fff;border:8px solid #2563eb;border-radius:34px;padding:34px 44px;display:flex;
  flex-direction:column;gap:16px;align-items:center;max-width:94vw}
#resTitle{font-size:clamp(34px,6vw,54px);font-weight:900;color:#1d4ed8}
.resRow{font-size:clamp(22px,3.6vw,32px);font-weight:800;background:#f1f5f9;border-radius:18px;padding:12px 26px;min-width:min(480px,84vw)}
.resRow b{color:#1d4ed8}
.resNew{color:#dc2626;font-weight:900}
#resBtns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px}

#err{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:26px;font-weight:800;color:#334155;background:#eaf5ff;padding:30px}
</style>
</head>
<body>

<!-- ==================== 화면들 ==================== -->
<div id="scStart" class="screen">
  <div class="title">🖊️ 볼펜 조립 공장</div>
  <div class="subtitle">차근차근, 즐겁게 조립해요!</div>
  <button id="btnStart" class="bigbtn">▶️ 시작하기</button>
  <div class="hint3">
    <div>🖐️ 부품을 <b>끌어서</b> 알맞은 자리에 놓아요</div>
    <div>🔊 스피커 버튼을 누르면 다시 들려줘요</div>
    <div>🔍 다 만들면 검사하고 상자에 담아요</div>
  </div>
</div>

<div id="scMode" class="screen hide">
  <div class="qtitle">어떤 볼펜을 만들까요?</div>
  <div class="cards">
    <button class="card" id="btnSingle">
      <span class="cicon">🖊️</span><span class="cname">단색 볼펜</span>
      <span class="cdesc">한 가지 색</span><span class="cbadge easy">쉬워요 · 부품 5개</span>
    </button>
    <button class="card" id="btnTri">
      <span class="cicon">🌈</span><span class="cname">삼색 볼펜</span>
      <span class="cdesc">검정 · 빨강 · 파랑</span><span class="cbadge hard">도전! · 부품 13개</span>
    </button>
  </div>
  <button class="backbtn" id="backMode">← 뒤로</button>
</div>

<div id="scRun" class="screen hide">
  <div class="qtitle">어떻게 해 볼까요?</div>
  <div class="cards">
    <button class="card" id="btnPractice">
      <span class="cicon">🐢</span><span class="cname">연습 모드</span>
      <span class="cdesc">천천히 배워요</span><span class="cbadge easy">도우미가 도와줘요</span>
    </button>
    <button class="card" id="btnProduction">
      <span class="cicon">🏭</span><span class="cname">생산 모드</span>
      <span class="cdesc">시간을 재요</span><span class="cbadge hard">빠르고 정확하게!</span>
    </button>
  </div>
  <button class="backbtn" id="backRun">← 뒤로</button>
</div>

<div id="scCount" class="screen hide">
  <div class="qtitle">몇 개 만들까요?</div>
  <div class="cards">
    <button class="bigbtn cnt" data-n="1">1개</button>
    <button class="bigbtn cnt" data-n="3">3개</button>
    <button class="bigbtn cnt" data-n="5">5개</button>
  </div>
  <button class="backbtn" id="backCount">← 뒤로</button>
</div>

<div id="scResult" class="screen hide">
  <div id="resCard">
    <div id="resTitle">🎉 참 잘했어요!</div>
    <div id="resRows"></div>
    <div id="resBtns">
      <button id="btnAgain" class="bigbtn green">🔄 다시 하기</button>
      <button id="btnHome" class="bigbtn">🏠 처음으로</button>
    </div>
  </div>
</div>

<!-- ==================== HUD ==================== -->
<div id="hud" class="hide">
  <div id="sidebar"></div>
  <div id="chips">
    <span class="chip" data-i="0">① 분류</span>
    <span class="chip" data-i="1">② 조립</span>
    <span class="chip" data-i="2">③ 검수</span>
  </div>
  <div id="stats">
    <span id="tMode">🐢 연습</span>
    <span id="tTime">⏱ 0:00</span>
    <span id="tCount">🖊 0/1</span>
  </div>
  <div id="topbtns">
    <button id="btnMute" class="round" title="소리 켜기/끄기">🔊</button>
    <button id="btnQuit" class="round" title="처음으로">🏠</button>
  </div>
  <div id="banner">
    <button id="btnSpeak" title="다시 듣기">🔊</button>
    <span id="bannerText">준비!</span>
    <span id="pressDots"></span>
  </div>
  <div id="taskPanel" class="hide">
    <div class="tpHead"><span>📋 할 일</span><span id="tpPen">🖊 1/1</span></div>
    <ul id="taskList"></ul>
  </div>
  <div id="checkBtns" class="hide">
    <button id="btnCheckYes">✅ 네!</button>
    <button id="btnCheckNo" class="hide">❌ 아니요</button>
  </div>
  <button id="btnHelp" class="hide">🙋 도와주세요</button>
</div>

<div id="stamp" class="hide">합격</div>
<div id="toast" class="hide"></div>
<div id="err" class="hide"></div>

<!-- Three.js 버전 고정(pin): 반드시 0.184.0 유지. @latest 금지 -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   설정값 (난이도 미세조정은 여기 숫자만 바꾸면 됨)  — TODO(확장)
   ========================================================= */
const CFG = {
  SNAP: 1.7,          // 조립: 이 거리 안에서 놓으면 결합
  MAGNET: 1.05,       // 조립: 드래그 중 이 거리 안이면 자동 결합(자석)
  BIN_R: 1.6,         // 분류: 칸 판정 반경
  BIN_MAGNET: 0.95,   // 분류: 드래그 중 자동 들어감
  HINT_IDLE_MS: 12000,// 이 시간 동안 가만히 있으면 안내 반복+힌트
  WRONG_STREAK: 2,    // 생산 모드: 연속 오답 n번이면 힌트 켜줌
  HINT_BOOST_MS: 9000,
  TTS_RATE: 0.95,
  DRAG_Y_SORT: 0.7,   // 분류 때 부품이 떠다니는 높이(칸 높이와 비슷해야 판정이 정확)
  DRAG_Y_ASM: 1.25,   // 조립 때 높이(반드시 조립대 JIG 높이와 같게)
};
/* 점수 서버(Google Apps Script) 연동 — TODO(확장):
   아래에 웹앱 URL을 넣으면 결과가 자동 전송됨. 비워두면 전송 안 함. */
const SCORE_ENDPOINT = '';

const COLORS = { black:0x2b2f36, red:0xe63946, blue:0x1d6ce0 };
const CNAME  = { black:'검정', red:'빨강', blue:'파랑' };
const CHEX   = { black:'#2b2f36', red:'#e63946', blue:'#1d6ce0' };
const SLOTY  = { black:0.32, red:0, blue:-0.32 };
const BRASS = 0xc9a227;

const $ = id => document.getElementById(id);
const v3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const now = () => performance.now();
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));

/* 한국어 조사: 받침 유무 */
function josa(word, pair){ // pair: '을를' | '이가' | '은는'
  const c = word.charCodeAt(word.length-1);
  const has = (c>=0xAC00 && c<=0xD7A3) ? ((c-0xAC00)%28)>0 : true;
  return has ? pair[0] : pair[1];
}
function fmtTime(ms){
  const s = Math.max(0, Math.round(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

/* =========================================================
   소리 (Web Audio 합성 — 외부 파일 없음)
   ========================================================= */
let actx = null, muted = false;
function audioInit(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume().catch(()=>{}); }
function tone(freq0, freq1, dur, type='sine', vol=0.2, when=0){
  if(!actx || muted) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq0, t);
  if(freq1 !== freq0) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq1), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);

const tweens = [];
const easeOutCubic = k => 1-Math.pow(1-k,3);
const easeOutBack = k => { const c=2.0; return 1 + (c+1)*Math.pow(k-1,3) + c*Math.pow(k-1,2); };
function tween(dur, fn, opt={}){
  const tw = {t:0, dur, fn, ease:opt.ease||easeOutCubic, done:opt.done};
  tweens.push(tw); return tw;
}
function moveTo(obj, to, dur, ease, done){
  const f = obj.position.clone(), t = to.clone();
  tween(dur, k=>obj.position.lerpVectors(f,t,k), {ease, done});
}
function scaleTo(obj, s, dur){
  const f = obj.scale.clone(), t = v3(s,s,s);
  tween(dur, k=>obj.scale.lerpVectors(f,t,k));
}

function buildPart(def){
  const g = def.build();
  g.userData = { key:def.key, label:def.label, color:def.color||null, isPart:true };
  g.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(g);
  const s = bb.getSize(v3()), c = bb.getCenter(v3());
  g.userData.size = { x:s.x, y:s.y, z:s.z };
  const hm = new THREE.Mesh(new THREE.BoxGeometry(s.x+.7, s.y+.7, s.z+.7), HITMAT);
  hm.position.copy(c); hm.userData.isHit = true;
  // 주의: 순환 참조는 userData 밖에 둔다(three의 clone이 userData를 JSON 복사함)
  hm.partRef = g;
  g.add(hm); g.hitMesh = hm;
  return g;
}
function ghostify(src){
  const g = src.clone(true);
  g.traverse(o=>{
    if(o.userData && (o.userData.isHit || o.userData.noGhost)){ o.visible=false; return; }
    if(o.isMesh){ o.castShadow=false; o.receiveShadow=false;
      const col = o.material && o.material.color ? o.material.color.clone() : new THREE.Color(0xffffff);
      o.material = new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.3, depthWrite:false});
    }
  });
  g.userData = {ghost:true};
  return g;
}

/* =========================================================
   과제 체크리스트(왼쪽) — TEACCH 시각 스케줄: 무엇을·얼마나·언제 끝나는지·다음은 무엇인지
   한 볼펜 분량(분류 → 조립 단계들 → 검수 항목들 → 상자에 담기)을 위→아래로 보여 주고,
   학생이 실제로 끝낸 항목이 ✓로 바뀐다(연습·생산 모드 공통).
   ========================================================= */
function buildTaskList(){
  const items = [];
  if(!basketMode()) items.push({id:'sort', label:'부품 분류하기', total:S.data.defs.length});
  S.data.steps.forEach((st,i)=> items.push({id:'step'+i, label:st.task || st.name+' 끼우기', total:st.keys.length}));
  S.data.checks.forEach((ck,i)=> items.push({id:'check'+i, label:ck.task || ck.short.replace(/^[^ ]+ /,'')}));
  items.push({id:'box', label:'상자에 담기'});
  S.tasks = items; S.taskDone = new Set(); S.taskCur = null;
  const ul = $('taskList'); ul.innerHTML = '';
  items.forEach((it,i)=>{
    const li = document.createElement('li'); li.dataset.id = it.id;
    li.innerHTML = `<span class="tk">${i+1}</span><span class="tn">${it.label}</span><span class="tc"></span>`;
    ul.appendChild(li);
  });
  $('tpPen').textContent = `🖊 ${S.penIndex}/${S.total}`;
  $('taskPanel').classList.toggle('compact', items.length > 12);
  $('taskPanel').classList.remove('hide');
  updateTaskPanel();
}
function updateTaskPanel(){
  if(!S.tasks) return;
  const lis = $('taskList').children;
  S.tasks.forEach((it,i)=>{
    const li = lis[i]; if(!li) return;
    const done = S.taskDone.has(it.id), cur = S.taskCur===it.id && !done;
    li.classList.toggle('ok', done); li.classList.toggle('now', cur);
    li.querySelector('.tk').textContent = done ? '✓' : (cur ? '▶' : String(i+1));
    li.querySelector('.tc').textContent = (it.total>1 && !done) ? `${it.prog||0}/${it.total}` : '';
  });
}
function taskCurrent(id){ if(!S.tasks) return; S.taskCur = id; updateTaskPanel(); }
function taskProgress(id, n){ const it = S.tasks && S.tasks.find(t=>t.id===id); if(it){ it.prog = n; updateTaskPanel(); } }
function taskDone(id){
  if(!S.tasks || S.taskDone.has(id)) return;
  S.taskDone.add(id); if(S.taskCur===id) S.taskCur = null;
  updateTaskPanel();
  const li = [...$('taskList').children].find(l=>l.dataset.id===id);
  if(li){ li.classList.remove('just'); void li.offsetWidth; li.classList.add('just'); }
  sTick();
}

/* =========================================================
   ① 분류 스테이지
   ========================================================= */
function clearGroup(g){ while(g.children.length) g.remove(g.children[0]); }

function makeBin(def){
  const g = new THREE.Group();
  const rim = def.color ? COLORS[def.color] : 0x94a3b8;
  const base = boxM(2.5,.14,1.7, mat(0xffffff,{rough:.85}), 0,.07,0);
  base.receiveShadow = true; base.binKey = def.binKey || def.key; g.add(base);
  const rm = mat(rim,{rough:.6});
  g.add(boxM(2.5,.36,.12, rm, 0,.24,.79), boxM(2.5,.36,.12, rm, 0,.24,-.79),
        boxM(.12,.36,1.7, rm, -1.19,.24,0), boxM(.12,.36,1.7, rm, 1.19,.24,0));
  const lbl = makeTextSprite(def.binLabel||def.label,
    {border:def.color?CHEX[def.color]:'#64748b', fs:40});
  lbl.position.y = def.binZ < -2.5 ? 1.95 : 1.35; g.add(lbl);
  const src = buildPart(def);
  const mini = ghostify(src);
  mini.scale.setScalar(Math.min(.6, 2.0/src.userData.size.x));
  mini.position.y = .5;
  g.add(mini);
  g.position.set(def.binX, 0, def.binZ);
  return { def, binKey:def.binKey||def.key, group:g, base, center:v3(def.binX,.55,def.binZ), count:0 };
}

function setupSorting(){
  S.stage = 'sort'; setChips(1);
  S.suggestIdx = 0; S.wrongStreak = 0; S.lastAction = now();
  clearGroup(partsG); clearGroup(binsG); clearGroup(trayG); clearGroup(ghostsG);
  jigG.visible = false;
  scene.remove(penGroup); penGroup = new THREE.Group(); scene.add(penGroup);
  penGroup.position.copy(JIG);
  hideChecksUI();

  const d = S.data;
  // 부품 상자(트레이)
  const tp = boxM(d.trayBox.w,.12,d.trayBox.d, mat(0xffe9a8,{rough:.9}), 0,.06,d.trayBox.z);
  tp.receiveShadow = true; tp.castShadow = false; trayG.add(tp);
  // 분류 칸
  // 같은 종류(binKey)는 칸 하나를 같이 쓴다 (예: 삼색 스프링 3개 → 스프링 칸 1개)
  S.bins = []; const seenBins = new Set();
  d.defs.forEach(def=>{
    const bk = def.binKey || def.key;
    if(seenBins.has(bk)) return;
    seenBins.add(bk);
    const b = makeBin(def);
    b.multi = d.defs.filter(x=>(x.binKey||x.key)===bk).length;
    binsG.add(b.group); S.bins.push(b);
  });
  // 부품 흩어놓기
  const slots = [...d.traySlots].sort(()=>Math.random()-.5);
  S.parts = d.defs.map((def,i)=>{
    const p = buildPart(def);
    const sl = slots[i];
    p.position.set(sl.x+(Math.random()-.5)*.5, sl.y, sl.z+(Math.random()-.5)*.4);
    p.userData.home = p.position.clone();
    // 긴 부품은 트레이에서 조금 작게(집으면 커짐) — 겹침 방지
    const len = p.userData.size.x;
    const ts = len>3.5 ? .55 : (len>2.2 ? .8 : 1);
    p.scale.setScalar(ts); p.userData.homeScale = ts;
    partsG.add(p); return p;
  });
  camPose(v3(0,0.5,0), camera.aspect<1.3 ? 18.5 : 17, 0.5);
  taskCurrent('sort');
  announceSort(true);
}
function curSuggest(){
  const defs = S.data.defs;
  for(let i=0;i<defs.length;i++){
    const p = partOf(defs[i].key);
    if(p && !p.userData.sorted) return defs[i];
  }
  return null;
}
function announceSort(first){
  const d = curSuggest(); if(!d) return;
  const eul = josa(d.label,'을를');
  const pre = first ? '' : (S.praiseN%3===2 ? praise()+' ' : '');
  setInstruction(`${labelHtml(d)}${eul} 찾아 칸에 넣어요`,
    (first?'부품을 알맞은 칸에 넣어요. ':pre) + `${d.label}${eul} 찾아 칸에 넣어요.`);
}
function binOf(key){ const bk = binKeyOf(key); return S.bins.find(b=>b.binKey===bk); }
function placeSorted(part, bin){
  part.userData.sorted = true; S.correct++; S.wrongStreak = 0; S.lastAction = now();
  drag = null;
  bin.count = (bin.count||0)+1;
  const to = bin.center.clone();
  if(bin.multi>1) to.x += (bin.count-2)*.7; // 같은 칸에 여러 개면 나란히 쌓기
  moveTo(part, to, 280);
  const bs = Math.min(.9, 2.0/part.userData.size.x);
  scaleTo(part, bs, 200);
  part.userData.home = to.clone();
  part.userData.homeScale = bs;
  sClick(); flashRing(to.clone().add(v3(0,.4,0)));
  taskProgress('sort', S.parts.filter(p=>p.userData.sorted).length);
  if(curSuggest()){ S.praiseN++; announceSort(false); }
  else {
    taskDone('sort');
    S.stage = 'trans';
    setInstruction('분류 끝! 참 잘했어요 👏', '분류 끝! 참 잘했어요.');
    sChime();
    setTimeout(setupAssembly, 1300);
  }
}

/* =========================================================
   재료 바구니 (생산 모드): 왼쪽 칸막이 바구니에서 하나씩 꺼내 쓴다.
   각 칸에는 만들 개수만큼만 들어 있어 바구니가 비면 일이 끝난 것.
   (TEACCH 작업 시스템: 왼쪽=재료 → 가운데=작업 → 오른쪽=완성)
   ========================================================= */
function makeCell(def, x, z){
  const g = new THREE.Group();
  const rim = def.color ? COLORS[def.color] : 0x94a3b8;
  const base = boxM(2.1,.14,1.3, mat(0xfff3d6,{rough:.85}), 0,.07,0);
  base.receiveShadow = true; g.add(base);
  const rm = mat(rim,{rough:.6});
  g.add(boxM(2.1,.42,.1, rm, 0,.27,.6), boxM(2.1,.42,.1, rm, 0,.27,-.6),
        boxM(.1,.42,1.3, rm, -1,.27,0), boxM(.1,.42,1.3, rm, 1,.27,0));
  const hit = boxM(2.3,1.7,1.5, HITMAT, 0,.85,0); // 위 공간까지 눌러도 잡히게
  g.add(hit);
  g.position.set(x,0,z);
  return {g, hit};
}
function cellStock(c){ return c.stock||0; }
function refreshCell(c){
  clearGroup(c.stockG);
  if(c.lbl){ c.group.remove(c.lbl); c.lbl = null; }
  const d = c.def, n = cellStock(c);
  c.lbl = makeTextSprite(`${d.binLabel||d.label} ${n}`,
    {border:d.color?CHEX[d.color]:'#64748b', fs:32});
  c.lbl.position.y = c.lblY || 1.45; c.group.add(c.lbl);
  for(let i=0;i<Math.min(n,3);i++){ // 남은 개수만큼 실물이 쌓여 보임(최대 3단)
    const m = buildPart(d);
    m.scale.setScalar(Math.min(.5, 1.7/m.userData.size.x));
    m.position.set(0, .3+i*.16, (i-1)*.2);
    c.stockG.add(m);
  }
}
function setupBasket(){
  clearGroup(basketG); S.cells = [];
  const groups = [], seen = new Map();
  S.data.defs.forEach(def=>{
    const bk = def.binKey || def.key;
    if(!seen.has(bk)){ const grp = {binKey:bk, def, keys:[]}; seen.set(bk, grp); groups.push(grp); }
    seen.get(bk).keys.push(def.key);
  });
  const cols = groups.length > 6 ? 2 : 1;
  const rows = Math.ceil(groups.length/cols);
  const x0 = cols===2 ? -8.1 : -7.6, dx = 2.25, dz = 1.5;
  const z0 = -((rows-1)/2)*dz + .4;
  groups.forEach((grp,i)=>{
    const cell = makeCell(grp.def, x0 + (i%cols)*dx, z0 + Math.floor(i/cols)*dz);
    const c = { binKey:grp.binKey, def:grp.def, keys:grp.keys, hit:cell.hit,
      group:cell.g, center:v3(cell.g.position.x,.55,cell.g.position.z),
      stock:grp.keys.length * S.total, // 만들 개수만큼만 → 바구니가 비면 일이 끝난 것
      lblY: 1.45 + (i%cols)*.45, // 옆 칸 라벨과 겹치지 않게 열마다 높이 엇갈림
      stockG:new THREE.Group(), lbl:null };
    cell.g.add(c.stockG);
    basketG.add(cell.g);
    S.cells.push(c);
    refreshCell(c);
  });
}
function pickCellAt(e){
  if(!S.cells.length) return null;
  scene.updateMatrixWorld(true);
  ray.setFromCamera(ndcOf(e), camera);
  const hits = ray.intersectObjects(S.cells.map(c=>c.hit), false);
  if(!hits.length) return null;
  // 히트박스가 겹치면(앞칸이 뒤칸을 가림) 화면상 가장 가까운 칸을 고른다
  let best = null, bd = 1e9; const wp = v3();
  for(const h of hits){
    const c = S.cells.find(cc=>cc.hit===h.object);
    if(!c) continue;
    c.hit.getWorldPosition(wp);
    const sp = projXY(wp);
    const d = Math.hypot(sp.x - e.clientX, sp.y - e.clientY);
    if(d < bd){ bd = d; best = c; }
  }
  return best;
}
function takeFromBasket(cell){
  if(cellStock(cell) <= 0){ sBoing(); speak('이 칸은 비었어요.'); return null; }
  // 지금 차례(pending) 부품 우선, 아니면 아직 안 꺼낸 부품
  let key = cell.keys.find(k=>S.pending.includes(k));
  if(!key) key = cell.keys.find(k=>!partOf(k));
  if(!key){ sBoing(); speak('이 부품은 벌써 끼웠어요.'); return null; }
  cell.stock--;
  const p = buildPart(defOf(key));
  p.position.copy(cell.center); p.position.y = CFG.DRAG_Y_ASM;
  p.userData.home = cell.center.clone();
  p.userData.homeScale = 1;
  p.userData.fromBasket = cell.binKey;
  partsG.add(p); S.parts.push(p);
  refreshCell(cell);
  return p;
}
function returnToBasket(part){ // 잘못 꺼냈으면 다시 바구니로(재고 복구)
  const cell = S.cells.find(c=>c.binKey===part.userData.fromBasket);
  scaleTo(part, .5, 260);
  moveTo(part, part.userData.home, 300, undefined, ()=>{
    partsG.remove(part);
    S.parts = S.parts.filter(p=>p!==part);
    if(cell){ cell.stock++; refreshCell(cell); }
  });
}

/* =========================================================
   ② 조립 스테이지
   ========================================================= */
function setupAssembly(){
  S.stage = 'assemble'; setChips(2);
  jigG.visible = true; basketG.visible = true; binsG.visible = true;
  S.stepIdx = 0; S.lastAction = now();
  const a = camera.aspect;
  if(basketMode()) // 왼쪽 바구니 ~ 오른쪽 완성 상자까지 보이게 — 좁은 화면일수록 더 멀리서
    camPose(v3(-0.7,0.8,0.3), a<1.3 ? 19 : 17.5, 0.47);
  else camPose(v3(0,0.9,0.4), a<1.3 ? 18 : 16.5, 0.47);
  $('btnHelp').classList.toggle('hide', !basketMode()); // 생산 모드: 스스로 도움 요청
  startStep(true);
}
function curStep(){ return S.data.steps[S.stepIdx]; }
function startStep(first){
  const st = curStep();
  S.pending = [...st.keys]; S.wrongStreak = 0;
  buildGhosts();
  const bk = basketMode();
  const intro = (first ? '이제 순서대로 조립해요. ' : '') + (bk ? '바구니에서 꺼내요. ' : '');
  const pre = bk ? '🧺 ' : '';
  if(st.group){
    const html = st.html || `${st.group}${josa(st.group,'을를')} <b style="color:#d97706">같은 색</b> 자리에 꽂아요`;
    const tts = st.tts || `${st.group}${josa(st.group,'을를')} 같은 색 자리에 꽂아요.`;
    setInstruction(pre + html, intro + tts);
  } else {
    const d = defOf(st.keys[0]);
    const eul = josa(d.label,'을를');
    const glow = hintsOn(); // 힌트(고스트)가 보일 때만 "반짝이는 자리" 표현
    setInstruction(`${pre}${labelHtml(d)}${eul} ${glow?'반짝이는 자리에 놓아요':'끼워요'}`,
      intro + `${d.label}${eul} 끼워요.`);
  }
  taskCurrent('step'+S.stepIdx);
  taskProgress('step'+S.stepIdx, st.keys.length - S.pending.length);
}
function buildGhosts(){
  clearGroup(ghostsG);
  anchorRings.forEach(r=>{ r.visible = false; r.userData.key = null; });
  const group = S.pending.length > 1; // 색 그룹 단계는 링 생략(색 고스트가 안내)
  S.pending.forEach((key,i)=>{
    const def = defOf(key);
    const gh = ghostify(buildPart(def));
    gh.position.copy(anchorWorld(key));
    gh.userData.key = key;
    ghostsG.add(gh);
    if(!group && i<3){ anchorRings[i].position.copy(anchorWorld(key)); anchorRings[i].userData.key = key; }
  });
}
function placePart(part){
  const key = part.userData.key;
  part.userData.placed = true; S.correct++; S.wrongStreak = 0; S.lastAction = now();
  drag = null;
  penGroup.attach(part);
  const a = defOf(key).anchor;
  const f = part.position.clone();
  tween(340, k=>part.position.lerpVectors(f,a,k), {ease:easeOutBack,
    done:()=>{ sClick(); flashRing(anchorWorld(key)); }});
  scaleTo(part, 1, 220);
  S.pending = S.pending.filter(k=>k!==key);
  const gh = ghostsG.children.find(g=>g.userData.key===key);
  if(gh) ghostsG.remove(gh);
  anchorRings.forEach(r=>{ if(r.userData.key===key) r.visible=false; });
  taskProgress('step'+S.stepIdx, curStep().keys.length - S.pending.length);
  if(S.pending.length===0){
    taskDone('step'+S.stepIdx);
    S.stepIdx++;
    if(S.stepIdx >= S.data.steps.length){
      S.stage = 'trans';
      clearGroup(ghostsG); anchorRings.forEach(r=>r.visible=false);
      setInstruction('조립 끝! 멋져요 ✨', '조립 끝! 멋져요.');
      sChime();
      setTimeout(setupInspection, 1100);
    } else startStep(false);
  } else {
    speak(praise());
  }
}
function snapHome(part){
  if(part.userData.fromBasket){ returnToBasket(part); return; } // 바구니 부품은 제자리(칸)로
  moveTo(part, part.userData.home, 320);
  scaleTo(part, part.userData.homeScale || 1, 200);
}
function maybeBoost(){
  if(S.run==='production' && S.wrongStreak >= CFG.WRONG_STREAK)
    S.hintBoostUntil = now() + CFG.HINT_BOOST_MS;
}
function magnetKeyFor(part){ // any 스텝(스프링처럼 서로 같은 부품)은 아무 빈 자리나 허용
  const st = curStep(); if(!st) return null;
  const key = part.userData.key;
  if(st.any && st.keys.includes(key)){
    let best=null, bd=1e9;
    for(const k of S.pending){
      const dd = part.position.distanceTo(anchorWorld(k));
      if(dd<bd){ bd=dd; best=k; }
    }
    return best ? {key:best, d:bd} : null;
  }
  if(S.pending.includes(key))
    return {key, d:part.position.distanceTo(anchorWorld(key))};
  return null;
}
function rekeyFor(part, key){ // any 스텝: 같은 부품끼리 키를 맞교환(중복 키 방지)
  if(part.userData.key === key) return;
  const other = S.parts.find(p=>p!==part && p.userData.key===key && !p.userData.placed);
  if(other) other.userData.key = part.userData.key;
  part.userData.key = key;
}
function onDropAssemble(part){
  const anyst = curStep();
  if(anyst && anyst.any && anyst.keys.includes(part.userData.key)){
    const mk = magnetKeyFor(part);
    if(mk && mk.d < CFG.SNAP){ rekeyFor(part, mk.key); placePart(part); return; }
    snapHome(part); return;
  }
  const key = part.userData.key;
  if(S.pending.includes(key)){
    const own = anchorWorld(key);
    if(part.position.distanceTo(own) < CFG.SNAP){ placePart(part); return; }
    // 같은 그룹의 다른(색이 다른) 자리 근처인지
    let other=null, od=1e9;
    for(const k of S.pending){ if(k===key) continue;
      const dd = part.position.distanceTo(anchorWorld(k));
      if(dd<od){ od=dd; other=k; } }
    if(other && od < 1.4){
      S.wrong++; S.wrongStreak++; maybeBoost(); sBoing();
      const d = defOf(key);
      speak(`${CNAME[d.color]} ${d.kind}${josa(d.kind,'은는')} ${CNAME[d.color]} 자리에 놓아요.`);
      snapHome(part);
    } else snapHome(part);
  } else {
    const nearJig = part.position.distanceTo(JIG) < 3.9;
    if(nearJig){
      S.wrong++; S.wrongStreak++; maybeBoost(); sBoing();
      const st = curStep();
      const nm = st.group || defOf(st.keys[0]).label;
      speak(`지금은 ${nm} 차례예요.`);
    }
    snapHome(part);
  }
}

/* =========================================================
   ③ 검수 스테이지
   ========================================================= */
let focusRing = null, autoRot = false;
const pressBusyK = new Set();
function hideChecksUI(){
  $('checkBtns').classList.add('hide');
  $('pressDots').innerHTML = '';
  if(focusRing){ penGroup.remove(focusRing); focusRing = null; }
}
function applyDefect(df){ // 불량 만들기: 스프링 빠짐 / 뚜껑 헐거움
  const p = partOf(df.key);
  if(!p){ S.defect = null; return; }
  if(df.key.startsWith('spring')){ df.kind = 'missing'; p.visible = false; }
  else {
    df.kind = 'loose'; df.pos0 = p.position.clone();
    p.position.x += .9; p.rotation.z = .12;
  }
}
function fixDefect(df, done){ // 학생이 불량을 찾으면 고쳐지는 애니메이션(재작업)
  const p = partOf(df.key);
  if(df.kind==='missing'){
    p.visible = true; p.scale.setScalar(.01); scaleTo(p, 1, 400);
  } else {
    moveTo(p, df.pos0, 400);
    tween(400, k=>{ p.rotation.z = .12*(1-k); });
  }
  sClick(); df.fixed = true;
  setTimeout(done, 750);
}
function setupInspection(){
  S.stage = 'inspect'; setChips(3);
  S.checkIdx = -1; // startCheck 전까지는 검수 항목 없음
  $('btnHelp').classList.add('hide');
  jigG.visible = false;
  camPose(v3(0.5,2.7,1.0), 9.8, 0.16); // 볼펜을 크게 가운데에
  basketG.visible = false; binsG.visible = false; // 검수 중엔 볼펜만 또렷하게
  moveTo(penGroup, v3(0,2.7,1.0), 700);
  // 생산 모드: 가끔 '불량' 볼펜 — 잘 보고 [아니요]를 골라 고치는 변별 연습
  S.defect = null;
  if(basketMode() && Math.random() < 0.25){
    const cand = S.data.checks.map((ck,i)=>({ck,i})).filter(x=>x.ck.type==='confirm');
    const pick = cand[(Math.random()*cand.length)|0];
    S.defect = { idx:pick.i, key:pick.ck.focus, fixed:false };
    applyDefect(S.defect);
  }
  setInstruction('잘 만들어졌는지 검사해요 🔍', '잘 만들어졌는지 검사해요.');
  setTimeout(()=>startCheck(0), 1600);
}
function startCheck(i){
  S.checkIdx = i; S.pressed = new Set(); pressBusyK.clear();
  const ck = S.data.checks[i];
  taskCurrent('check'+i);
  if(focusRing){ penGroup.remove(focusRing); focusRing = null; }
  $('pressDots').innerHTML = '';
  if(ck.type === 'confirm'){
    autoRot = true;
    focusRing = makeRing(2.0);
    focusRing.position.copy(defOf(ck.focus).anchor);
    penGroup.add(focusRing);
    $('btnCheckYes').textContent = ck.yes;
    $('btnCheckNo').classList.toggle('hide', !basketMode()); // 생산 모드만 네/아니요 판단
    $('checkBtns').classList.remove('hide');
    setInstruction(ck.line, ck.line);
  } else {
    autoRot = false;
    tween(500, k=>{ penGroup.rotation.x *= (1-k); penGroup.rotation.y *= (1-k); });
    $('checkBtns').classList.add('hide');
    if(ck.targets.length > 1){
      $('pressDots').innerHTML = ck.targets.map(t=>{
        const c = defOf(t).color;
        return `<i data-k="${t}" style="background:${CHEX[c]}"></i>`;
      }).join('');
    }
    setInstruction(ck.line, ck.line);
  }
}
function completeCheck(){
  const i = S.checkIdx;
  taskDone('check'+i);
  sChime();
  if(focusRing){ penGroup.remove(focusRing); focusRing = null; }
  $('checkBtns').classList.add('hide');
  if(i+1 < S.data.checks.length) setTimeout(()=>startCheck(i+1), 500);
  else setTimeout(passInspection, 500);
}
function pressAnimOf(key){ return S.data.pressAnim[key]; }
function doPress(key){
  if(pressBusyK.has(key)) return;
  const pa = pressAnimOf(key); if(!pa) return;
  pressBusyK.add(key);
  const rod = partOf(key), refill = partOf(pa.refill), spring = partOf(pa.spring);
  const r0 = rod.position.x, f0 = refill.position.x;
  sClick();
  tween(180, k=>{
    rod.position.x = r0 + pa.dx*k;
    refill.position.x = f0 + pa.rdx*k;
    if(spring) spring.scale.x = 1 - .4*k;
  }, {done:()=>{
    setTimeout(()=>{
      tween(240, k=>{
        rod.position.x = r0 + pa.dx*(1-k);
        refill.position.x = f0 + pa.rdx*(1-k);
        if(spring) spring.scale.x = .6 + .4*k;
      }, {done:()=>{ pressBusyK.delete(key); }});
    }, 260);
  }});
  S.pressed.add(key);
  const dot = document.querySelector(`#pressDots i[data-k="${key}"]`);
  if(dot) dot.classList.add('on');
  const ck = S.data.checks[S.checkIdx];
  if(S.pressed.size >= ck.targets.length){
    setTimeout(completeCheck, 800);
  } else {
    speak('딸깍! 다른 것도 눌러 보아요.');
  }
}
function passInspection(){
  S.stage = 'trans';
  S.doneCount++;
  $('tCount').textContent = `🖊 ${S.doneCount}/${S.total}`;
  hideChecksUI();
  taskCurrent('box');
  showStamp(); sFanfare();
  setInstruction('합격! 🎉', '합격! 정말 잘했어요.');
  if(S.doneCount >= S.total) S.tEnd = now();
  camPose(v3(0,0.8,0), 15.5, 0.44);
  setTimeout(()=>{
    // 완성품 상자로 이동
    const idx = S.doneCount-1;
    const to = v3(BOX_POS.x + (idx%2? .3 : -.3), .6 + idx*.28, BOX_POS.z);
    const f = penGroup.position.clone(), fr = penGroup.rotation.x, sc = penGroup.scale.x;
    tween(850, k=>{
      penGroup.position.lerpVectors(f, to, k);
      penGroup.position.y += Math.sin(k*Math.PI)*2.2;
      const s = sc + (0.3-sc)*k; penGroup.scale.setScalar(s);
      penGroup.rotation.x = fr*(1-k); penGroup.rotation.y = 0; penGroup.rotation.z = -0.35*k;
    }, {done:()=>{
      doneG.add(penGroup);
      setBoxLabel(S.doneCount, S.total);
      taskDone('box');
      confetti();
      if(S.doneCount >= S.total){ setTimeout(showResults, 900); }
      else {
        toast(`${S.doneCount}개 완성! ⭐`);
        speak('좋아요! 다음 볼펜을 만들어요.');
        setTimeout(()=>{ S.penIndex++; nextPen(); }, 1900);
      }
    }});
  }, 1300);
}

/* =========================================================
   결과 화면 + 점수 전송 훅
   ========================================================= */
function showResults(){
  S.stage = null;
  const timeMs = (S.tEnd||now()) - S.t0;
  const att = S.correct + S.wrong;
  const acc = att ? Math.round(S.correct/att*100) : 100;
  const tier = acc===100 ? '완벽해요! 👏' : acc>=85 ? '아주 잘했어요! 😊' : acc>=60 ? '잘하고 있어요! 💪' : '천천히 하면 돼요! 🌱';
  const rows = [];
  rows.push(`🖊️ 만든 볼펜: <b>${S.doneCount}개</b> ${'⭐'.repeat(Math.min(5,S.doneCount))}`);
  if(S.run==='production') rows.push(`⏱️ 걸린 시간: <b>${fmtTime(timeMs)}</b>`);
  rows.push(`🎯 정확도: <b>${acc}%</b> — ${tier}`);
  if(S.run==='production' && S.helpCount>0)
    rows.push(`🙋 도움 요청: <b>${S.helpCount}회</b> — 잘 물어봤어요!`);
  let newBest = false;
  if(S.run==='production'){
    const key = `${S.mode}_${S.total}`;
    const best = BESTS[key];
    if(!best || timeMs < best){ BESTS[key] = timeMs; newBest = true;
      try{ localStorage.setItem('penSimBest', JSON.stringify(BESTS)); }catch(e){}
    }
    rows.push(newBest
      ? `🏆 최고 기록: <b>${fmtTime(BESTS[key])}</b> <span class="resNew">새 기록! 🎉</span>`
      : `🏆 최고 기록: <b>${fmtTime(BESTS[key])}</b>`);
  } else {
    rows.push('🐢 연습 모드 — 천천히 차근차근, 아주 잘했어요!');
  }
  $('resRows').innerHTML = rows.map(r=>`<div class="resRow">${r}</div>`).join('');
  showScreen('result');
  speak(`볼펜 ${S.doneCount}개 완성! ${newBest?'새 기록이에요! ':''}정말 잘했어요.`);
  sendResult({ ts:new Date().toISOString(), mode:S.mode, run:S.run, total:S.total,
    done:S.doneCount, timeSec:Math.round(timeMs/1000), accuracy:acc, wrong:S.wrong, help:S.helpCount });
}
function sendResult(payload){
  if(!SCORE_ENDPOINT) return; // URL이 비어 있으면 전송 안 함
  try{
    fetch(SCORE_ENDPOINT, { method:'POST',
      headers:{'Content-Type':'text/plain'},      // CORS preflight 회피
      body: JSON.stringify(payload) }).catch(()=>{});
  }catch(e){}
}

/* =========================================================
   게임 시작/리셋
   ========================================================= */
function nextPen(){ // 다음 볼펜: 생산은 바구니에서 계속, 연습은 분류 없이 칸에서 다시
  scene.remove(penGroup); penGroup = new THREE.Group(); scene.add(penGroup);
  penGroup.position.copy(JIG);
  hideChecksUI();
  buildTaskList();
  if(basketMode()){ S.parts = []; setupAssembly(); }
  else respawnInBins();
}
function respawnInBins(){ // 연습 모드 2번째 볼펜부터: 분류는 첫 볼펜만, 이후엔 칸에 미리 담겨 있음
  clearGroup(partsG); clearGroup(ghostsG); clearGroup(trayG);
  S.bins.forEach(b=>b.count = 0);
  S.parts = S.data.defs.map(def=>{
    const p = buildPart(def);
    const bin = binOf(def.key);
    bin.count++;
    const to = bin.center.clone();
    if(bin.multi>1) to.x += (bin.count-2)*.7;
    p.position.copy(to);
    const bs = Math.min(.9, 2.0/p.userData.size.x);
    p.scale.setScalar(bs);
    p.userData.home = to.clone(); p.userData.homeScale = bs;
    p.userData.sorted = true;
    partsG.add(p); return p;
  });
  setupAssembly();
}
function startGame(){
  S.penIndex = 1; S.doneCount = 0; S.correct = 0; S.wrong = 0;
  S.hintBoostUntil = 0; S.praiseN = 0; S.tEnd = 0;
  S.helpCount = 0; S.defect = null; S.checkIdx = -1; S.pending = [];
  S.data = buildModeData(S.mode);
  clearGroup(doneG); setBoxLabel(0, S.total);
  $('tMode').textContent = S.run==='practice' ? '🐢 연습' : '🏭 생산';
  $('tTime').style.display = S.run==='production' ? '' : 'none';
  $('tCount').textContent = `🖊 0/${S.total}`;
  // 생산 모드는 분류 단계가 없으므로 단계 칩 번호를 다시 매김
  const cNames = ['분류','조립','검수'], cNums = ['①','②','③'];
  document.querySelectorAll('.chip').forEach((c,i)=>{
    const off = basketMode() ? 1 : 0;
    c.style.display = (i===0 && basketMode()) ? 'none' : '';
    c.textContent = cNums[Math.max(0, i-off)] + ' ' + cNames[i];
  });
  showScreen(null);
  S.t0 = now();
  buildTaskList();
  if(basketMode()){
    clearGroup(partsG); clearGroup(binsG); clearGroup(trayG); clearGroup(ghostsG);
    scene.remove(penGroup); penGroup = new THREE.Group(); scene.add(penGroup);
    penGroup.position.copy(JIG);
    hideChecksUI();
    S.parts = []; S.bins = [];
    setupBasket();
    setupAssembly();
  } else {
    clearGroup(basketG); S.cells = [];
    setupSorting();
  }
}
function resetToStart(){
  S.stage = null;
  clearGroup(partsG); clearGroup(binsG); clearGroup(trayG); clearGroup(ghostsG); clearGroup(doneG);
  clearGroup(basketG); S.cells = []; S.defect = null;
  $('btnHelp').classList.add('hide'); $('taskPanel').classList.add('hide'); S.tasks = null;
  jigG.visible = false; arrow.visible = false; binRing.visible = false;
  anchorRings.forEach(r=>r.visible=false);
  hideChecksUI(); setBoxLabel(0);
  scene.remove(penGroup); penGroup = new THREE.Group(); scene.add(penGroup);
  camPose(v3(0,0.8,0), 15.5, 0.46);
  showScreen('start');
}

/* =========================================================
   포인터(드래그) 처리
   ========================================================= */
const ray = new THREE.Raycaster();
let drag = null, camDrag = null, inspTouch = null;
function ndcOf(e){
  const r = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
}
function activeHits(){
  if(S.stage==='sort') return S.parts.filter(p=>!p.userData.sorted).map(p=>p.hitMesh);
  if(S.stage==='assemble'){
    const list = S.parts.filter(p=>!p.userData.placed).map(p=>p.hitMesh);
    // 칸(바닥판)을 누르면 그 칸의 부품이 집히게 — 히트박스 관대하게
    for(const b of S.bins){
      if(binPartsOf(b.binKey).some(p=>!p.userData.placed)) list.push(b.base);
    }
    return list;
  }
  if(S.stage==='inspect'){
    const ck = S.data.checks[S.checkIdx];
    if(ck && ck.type==='press') return ck.targets.map(k=>partOf(k).hitMesh);
  }
  return [];
}
function pickAt(e){
  scene.updateMatrixWorld(true); // 프레임 사이에 눌러도 최신 위치로 판정
  ray.setFromCamera(ndcOf(e), camera);
  const hits = ray.intersectObjects(activeHits(), false);
  if(!hits.length) return null;
  // 여러 개가 겹치면(앞칸 부품이 가림) 포인터와 화면상 가장 가까운 부품을 고른다
  let best = null, bd = 1e9;
  const seen = new Set(), wp = v3();
  for(const h of hits){
    const part = h.object.partRef || (h.object.binKey ? binPartsOf(h.object.binKey).find(p=>!p.userData.placed) : null);
    if(!part || seen.has(part)) continue;
    if(S.stage==='assemble' && part.userData.placed) continue;
    if(S.stage==='sort' && part.userData.sorted) continue;
    seen.add(part);
    part.getWorldPosition(wp);
    const sp = projXY(wp);
    const d = Math.hypot(sp.x - e.clientX, sp.y - e.clientY);
    if(d < bd){ bd = d; best = part; }
  }
  return best;
}
function planePoint(e, y){
  ray.setFromCamera(ndcOf(e), camera);
  const pl = new THREE.Plane(v3(0,1,0), -y);
  const out = v3();
  return ray.ray.intersectPlane(pl, out) ? out : null;
}
function dragY(){ return S.stage==='sort' ? CFG.DRAG_Y_SORT : CFG.DRAG_Y_ASM; }

renderer.domElement.addEventListener('pointerdown', e=>{
  audioInit();
  if(e.button !== undefined && e.button !== 0) return;
  if(S.screen !== 'game') return;
  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(err){}
  if(S.stage==='sort' || S.stage==='assemble'){
    let p = pickAt(e);
    if(!p && S.stage==='assemble' && basketMode()){
      const cell = pickCellAt(e); // 바구니 칸을 누르면 하나 꺼내서 바로 잡힘
      if(cell){
        p = takeFromBasket(cell);
        if(p){
          const pt = planePoint(e, dragY());
          if(pt) p.position.set(clamp(pt.x,-10.6,9.5), dragY(), clamp(pt.z,-5,5.4));
        }
      }
    }
    if(p){
      drag = { part:p, id:e.pointerId };
      sPop(); scaleTo(p, 1.05, 150);
      S.lastAction = now();
    } else camDrag = { x:e.clientX, y:e.clientY, az0:cam.azUser, el0:cam.elUser, id:e.pointerId };
  } else if(S.stage==='inspect'){
    inspTouch = { x:e.clientX, y:e.clientY, t:now(),
      rx:penGroup.rotation.x, ry:penGroup.rotation.y, moved:false, id:e.pointerId };
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(drag && e.pointerId===drag.id){
    const pt = planePoint(e, dragY());
    if(pt){
      drag.part.position.set(clamp(pt.x,-10.6,9.5), dragY(), clamp(pt.z,-5,5.4));
      // 자석: 드래그 중 자동 결합
      if(S.stage==='sort'){
        const bin = binOf(drag.part.userData.key);
        const dx = drag.part.position.x-bin.center.x, dz = drag.part.position.z-bin.center.z;
        if(Math.hypot(dx,dz) < CFG.BIN_MAGNET){ placeSorted(drag.part, bin); return; }
      } else if(S.stage==='assemble'){
        const mk = magnetKeyFor(drag.part);
        if(mk && mk.d < CFG.MAGNET){
          rekeyFor(drag.part, mk.key);
          placePart(drag.part); return;
        }
      }
    }
  } else if(camDrag && e.pointerId===camDrag.id){
    cam.azUser = clamp(camDrag.az0 - (e.clientX-camDrag.x)*0.004, -0.5, 0.5);
    cam.elUser = clamp(camDrag.el0 + (e.clientY-camDrag.y)*0.002, -0.12, 0.16);
  } else if(inspTouch && e.pointerId===inspTouch.id){
    const dx = e.clientX-inspTouch.x, dy = e.clientY-inspTouch.y;
    if(Math.abs(dx)+Math.abs(dy) > 10) inspTouch.moved = true;
    penGroup.rotation.y = inspTouch.ry + dx*0.008;
    penGroup.rotation.x = inspTouch.rx + dy*0.008;
  }
});
function endPointer(e){
  if(drag && e.pointerId===drag.id){
    const part = drag.part; drag = null;
    if(S.stage==='sort'){
      let best=null, bd=1e9;
      for(const b of S.bins){
        const d = Math.hypot(part.position.x-b.center.x, part.position.z-b.center.z);
        if(d<bd){ bd=d; best=b; }
      }
      if(best && bd < CFG.BIN_R){
        if(best.binKey === binKeyOf(part.userData.key)) placeSorted(part, best);
        else {
          S.wrong++; S.wrongStreak++; maybeBoost(); sBoing();
          const lb = part.userData.label;
          speak(`이 부품은 ${lb}! ${lb} 칸에 넣어요.`);
          snapHome(part);
        }
      } else snapHome(part);
    } else if(S.stage==='assemble'){
      onDropAssemble(part);
    } else snapHome(part);
  }
  if(camDrag && e.pointerId===camDrag.id) camDrag = null;
  if(inspTouch && e.pointerId===inspTouch.id){
    if(!inspTouch.moved && now()-inspTouch.t < 450){
      const ck = S.data.checks[S.checkIdx];
      if(ck && ck.type==='press'){
        // 화면 거리 기준: 가장 가까운 누름 대상(아주 관대한 히트박스)
        let best=null, bd=1e9; const wp=v3();
        for(const k of ck.targets){
          partOf(k).getWorldPosition(wp);
          const sp = projXY(wp);
          const d = Math.hypot(sp.x-e.clientX, sp.y-e.clientY);
          if(d<bd){ bd=d; best=k; }
        }
        if(best && bd < Math.max(150, innerWidth*.12)) doPress(best);
      }
    }
    inspTouch = null;
  }
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);

/* =========================================================
   메인 루프
   ========================================================= */
let lastT = performance.now(), elT = 0;
renderer.setAnimationLoop(()=>{
  const nowT = performance.now();
  const dt = Math.min((nowT-lastT)/1000, .05); lastT = nowT;
  elT += dt; const t = elT;
  // 트윈
  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i]; tw.t += dt*1000;
    const k = Math.min(1, tw.t/tw.dur);
    tw.fn(tw.ease(k));
    if(k>=1){ tweens.splice(i,1); tw.done && tw.done(); }
  }
  // 카메라
  const az = cam.azUser + (cam.sway ? Math.sin(t*.25)*.06 : 0);
  const el = cam.el + cam.elUser;
  const d = cam.dist;
  const desired = v3(
    cam.target.x + d*Math.sin(az)*Math.cos(el),
    cam.target.y + d*Math.sin(el),
    cam.target.z + d*Math.cos(az)*Math.cos(el));
  camera.position.lerp(desired, 1-Math.exp(-6*dt));
  cam.curTarget.lerp(cam.target, 1-Math.exp(-6*dt));
  camera.lookAt(cam.curTarget);
  // 힌트 표시
  const hint = hintsOn();
  let arrowTarget = null;
  if(S.stage==='sort'){
    const sug = curSuggest();
    if(sug){
      const p = partOf(sug.key);
      if(p && !p.userData.sorted && (!drag || drag.part!==p)) arrowTarget = p;
      const b = binOf(sug.key);
      binRing.visible = hint && !!b;
      if(b){ binRing.position.copy(b.center).add(v3(0,.55,0));
        const s = 2.0 + Math.sin(t*5)*.18; binRing.scale.set(s,s,1); }
    } else binRing.visible = false;
  } else if(S.stage==='assemble' && basketMode() && S.pending.length && !partOf(S.pending[0])){
    // 아직 바구니에서 안 꺼냈으면 → 지금 차례 부품의 칸이 반짝
    const cell = S.cells.find(c=>c.keys.includes(S.pending[0]));
    binRing.visible = hint && !!cell;
    if(cell){ binRing.position.copy(cell.center).add(v3(0,.8,0));
      const s = 2.0 + Math.sin(t*5)*.18; binRing.scale.set(s,s,1); }
  } else binRing.visible = false;
  if(S.stage==='assemble'){
    ghostsG.visible = hint;
    ghostsG.traverse(o=>{ if(o.isMesh && o.material.transparent) o.material.opacity = .22+.14*Math.sin(t*5); });
    anchorRings.forEach(r=>{
      if(S.pending.includes(r.userData.key)){
        r.visible = hint;
        const s = 1.5+Math.sin(t*5)*.15; r.scale.set(s,s,1);
      } else r.visible = false;
    });
    if(S.pending.length){
      const p = partOf(S.pending[0]);
      if(p && !p.userData.placed && (!drag || drag.part!==p)) arrowTarget = p;
    }
  } else { ghostsG.visible = false; anchorRings.forEach(r=>r.visible=false); }
  if(arrowTarget && hint){
    arrow.visible = true;
    arrow.position.copy(arrowTarget.position).add(v3(0, 1.1 + Math.sin(t*4)*.15, 0));
  } else arrow.visible = false;
  if(focusRing){ const s = 1.8+Math.sin(t*4.5)*.2; focusRing.scale.set(s,s,1); }
  // 검수 자동 회전
  if(S.stage==='inspect' && autoRot && !inspTouch) penGroup.rotation.x += dt*.6;
  // 생산 타이머
  if(S.screen==='game' && S.run==='production')
    $('tTime').textContent = '⏱ ' + fmtTime((S.tEnd||now()) - S.t0);
  // 가만히 있으면 다시 안내
  if((S.stage==='sort'||S.stage==='assemble') && now()-S.lastAction > CFG.HINT_IDLE_MS){
    S.lastAction = now();
    S.hintBoostUntil = now() + CFG.HINT_BOOST_MS;
    speak(lastTTS);
  }
  renderer.render(scene, camera);
});

/* =========================================================
   버튼 연결
   ========================================================= */
function bindTap(id, fn){ $(id).addEventListener('click', e=>{ audioInit(); sPop(); fn(e); }); }
bindTap('btnStart', ()=>{ showScreen('mode'); speak('어떤 볼펜을 만들까요?'); });
bindTap('btnSingle', ()=>{ S.mode='single'; showScreen('run'); speak('연습할까요? 생산할까요?'); });
bindTap('btnTri', ()=>{ S.mode='tri'; showScreen('run'); speak('연습할까요? 생산할까요?'); });
bindTap('btnPractice', ()=>{ S.run='practice'; showScreen('count'); speak('몇 개 만들까요?'); });
bindTap('btnProduction', ()=>{ S.run='production'; showScreen('count'); speak('몇 개 만들까요?'); });
document.querySelectorAll('.cnt').forEach(b=>{
  b.addEventListener('click', ()=>{ audioInit(); sPop();
    S.total = parseInt(b.dataset.n,10); startGame(); });
});
bindTap('backMode', ()=>showScreen('start'));
bindTap('backRun', ()=>showScreen('mode'));
bindTap('backCount', ()=>showScreen('run'));
bindTap('btnAgain', ()=>startGame());
bindTap('btnHome', ()=>resetToStart());
bindTap('btnQuit', ()=>resetToStart());
bindTap('btnSpeak', ()=>speak(lastTTS));
$('btnMute').addEventListener('click', ()=>{
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if(muted){ try{ speechSynthesis.cancel(); }catch(e){} }
  else speak('소리를 켰어요.');
});
bindTap('btnCheckYes', ()=>{
  if(S.stage!=='inspect') return;
  const ck = S.data.checks[S.checkIdx];
  if(!ck || ck.type!=='confirm') return;
  const df = S.defect;
  if(df && df.idx===S.checkIdx && !df.fixed){ // 불량인데 '네' → 다시 보게 안내
    S.wrong++; sBoing();
    speak('다시 한 번 잘 보아요. ' + ck.line);
    return;
  }
  S.correct++;
  completeCheck();
});
bindTap('btnCheckNo', ()=>{
  if(S.stage!=='inspect') return;
  const ck = S.data.checks[S.checkIdx];
  if(!ck || ck.type!=='confirm') return;
  const df = S.defect;
  if(df && df.idx===S.checkIdx && !df.fixed){ // 불량을 찾아냄!
    S.correct++;
    toast('잘 찾았어요! 🔎'); sChime();
    speak('맞아요! 잘 찾았어요. 바로 고쳐요.');
    fixDefect(df, ()=>{
      setInstruction(ck.line, '고쳤어요. 다시 확인해 보세요. ' + ck.line);
    });
  } else { // 괜찮은데 '아니요'
    S.wrong++; sBoing();
    speak('다시 한 번 잘 보아요. 괜찮으면 네를 눌러요.');
  }
});
bindTap('btnHelp', ()=>{ // 도움 요청도 배워야 할 직업 기술 — 횟수를 기록해 결과에 표시
  S.helpCount++;
  S.hintBoostUntil = now() + CFG.HINT_BOOST_MS;
  S.lastAction = now();
  speak(lastTTS || '도와줄게요.');
});

/* =========================================================
   테스트/확장용 공개 API (수업용 커스터마이즈에 활용 가능)
   ========================================================= */
function projXY(wp){ // 월드 좌표 → 화면 픽셀(3D 캔버스 위치·크기 기준)
  const v = wp.clone().project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  return { x:(v.x+1)/2*r.width + r.left, y:(-v.y+1)/2*r.height + r.top };
}
window.APP = {
  version:'1.2.0', THREE_REV: THREE.REVISION, CFG, S,
  state(){ return { screen:S.screen, stage:S.stage, mode:S.mode, run:S.run,
    penIndex:S.penIndex, done:S.doneCount, total:S.total, stepIdx:S.stepIdx,
    checkIdx:S.checkIdx, correct:S.correct, wrong:S.wrong,
    sorted:S.parts.filter(p=>p.userData.sorted).length,
    placed:S.parts.filter(p=>p.userData.placed).length }; },
  hint(){
    if(S.screen!=='game') return {action:'none'};
    if(S.stage==='sort'){
      const d = curSuggest(); if(!d) return {action:'wait'};
      const p = partOf(d.key), b = binOf(d.key);
      return {action:'drag', key:d.key, from:projXY(p.position), to:projXY(b.center)};
    }
    if(S.stage==='assemble'){
      if(!S.pending.length) return {action:'wait'};
      const key = S.pending[0], p = partOf(key);
      if(!p){ // 바구니 모드: 아직 안 꺼낸 상태
        const cell = S.cells.find(c=>c.keys.includes(key));
        return cell ? {action:'take', key, at:projXY(cell.center)} : {action:'wait'};
      }
      return {action:'drag', key, from:projXY(p.position), to:projXY(anchorWorld(key))};
    }
    if(S.stage==='inspect'){
      const ck = S.data.checks[S.checkIdx];
      if(!ck) return {action:'wait'};
      if(ck.type==='confirm') return {action:'confirm'};
      const next = ck.targets.find(k=>!S.pressed.has(k));
      if(!next) return {action:'wait'};
      const wp = v3(); partOf(next).getWorldPosition(wp);
      return {action:'press', key:next, at:projXY(wp)};
    }
    return {action:'wait'};
  },
};

/* 부팅 */
showScreen('start');
